<rect x="1535" y="840" width="620" height="351" rx="13" fill="#F7FAF9" stroke="#C9D8D3" stroke-width="2"/>
<text x="1553" y="876" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#18332F">Chú thích xác thực</text>
<text x="1553" y="912" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#546761">FK user_id → users.id: ON DELETE CASCADE.</text>
<text x="1553" y="941" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#546761">UQ auth_accounts: (provider_id, account_id).</text>
<text x="1553" y="970" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#546761">password lưu hash, không lưu mật khẩu rõ.</text>
<text x="1553" y="999" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#546761">Token/provider có thể NULL tùy cách đăng nhập.</text>
<text x="1553" y="1028" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#546761">auth_verifications liên kết bằng identifier;</text>
<text x="1553" y="1057" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#546761">không tự suy diễn identifier là khóa ngoại.</text>
<text x="1553" y="1086" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#546761">users.password_hash là cột legacy còn giữ lại.</text>
<text x="1553" y="1115" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#546761">Phiên hoạt động dùng auth_sessions.</text>
<text x="1553" y="1144" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#546761">Supabase cung cấp PostgreSQL; xác thực app</text>
<text x="1553" y="1173" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#546761">hiện dùng Better Auth, không Supabase Auth.</text>
<rect x="40" y="1300" width="1370" height="177" rx="13" fill="#F7FAF9" stroke="#C9D8D3" stroke-width="2"/>
<text x="58" y="1336" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#18332F">Phạm vi sơ đồ</text>
<text x="58" y="1372" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#546761">12 bảng ứng dụng được định nghĩa trong src/models; không liệt kê bảng nội bộ Supabase / lịch sử migration.</text>
<text x="58" y="1401" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#546761">Đây là tài liệu theo mã nguồn hiện tại, không phải ảnh chụp catalog database đang chạy.</text>
<text x="58" y="1430" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#546761">Các bảng bật RLS trong model; API truy cập qua backend và luôn kiểm tra user_id / quyền sở hữu.</text>
<text x="58" y="1459" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#546761">Không có giá trị token, mật khẩu, chuỗi kết nối hay dữ liệu người dùng trong tài liệu này.</text>
